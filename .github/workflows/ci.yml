# Minimal CI (PLAN.md §9): typecheck + the fake-driven test harness on the two
# engine floors (^20.19 and >=22.12) across Windows + Ubuntu. No network in the
# tests themselves: every test uses fakes (fake SDK/Discord/clock), so this never
# touches real Copilot or Discord. The Windows-only real-icacls test in
# secure-file.test.ts runs on the windows jobs; it is skipped on Ubuntu.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bash on both Ubuntu and Windows runners so the steps are identical.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20.19", "22.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No lockfile is committed (see .gitignore): this project is developed
      # behind a corporate npm proxy, so a lockfile generated there pins internal
      # hosts and carries that proxy's integrity hashes. Resolve fresh from the
      # public registry instead.
      - name: Install deps
        run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  lint-scripts:
    name: lint shell + installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12"
      # Bash syntax check for every shipped POSIX bootstrap/installer script.
      - name: bash -n on every shipped .sh
        run: |
          for f in install.sh get.sh run-bot.sh stop-bot.sh uninstall.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      # Node syntax check for the installer engine + its pure libs.
      - run: |
          for f in scripts/setup.mjs scripts/lib/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done
      # PowerShell parse check for every shipped .ps1, reproducing exactly how
      # `irm | iex` / `[scriptblock]::Create()` see these files over the
      # network: Invoke-RestMethod does NOT strip the UTF-8 BOM these files
      # ship with (neither on PowerShell 5.1 nor 7), so decoding with the BOM
      # preserved, trimming it, then parsing is what actually has to succeed.
      # Before this step NOTHING here ever parsed a single .ps1 — which is
      # exactly how get.ps1's leading BOM broke the documented one-liner
      # (`#Requires`/`param` failed to parse) without failing any CI check.
      - name: PowerShell parse check (simulates irm, BOM preserved then trimmed)
        shell: pwsh
        run: |
          $files = 'install.ps1', 'get.ps1', 'run-bot.ps1', 'stop-bot.ps1', 'uninstall.ps1'
          $failed = $false
          foreach ($f in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)  # keeps the BOM as U+FEFF, matching Invoke-RestMethod
            try {
              [scriptblock]::Create($text.TrimStart([char]0xFEFF)) | Out-Null
              Write-Host "OK: $f"
            } catch {
              Write-Host "FAIL: $f -- $($_.Exception.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

